name: 📊 Generate stats cards

on:
  schedule:
    - cron: "17 */12 * * *"   # twice a day
  workflow_dispatch:           # run it manually from the Actions tab
  push:
    branches: [main]
    paths: [".github/workflows/stats.yml"]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&rank_icon=github&bg_color=0d1424&title_color=ff2bd6&text_color=e6f1ff&icon_color=00ff9c&ring_color=22d3ee&border_color=22d3ee&border_radius=16&custom_title=%2F%2F%20system%20diagnostics
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&bg_color=0d1424&title_color=ff2bd6&text_color=e6f1ff&border_color=22d3ee&border_radius=16&custom_title=%2F%2F%20language%20payload
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "🤖 refresh stats cards" || exit 0
          git push
